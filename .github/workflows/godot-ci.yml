name: Godot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: false

      - name: Show Godot version
        run: godot --version

      - name: Import and parse project
        run: godot --headless --path . --editor --quit-after 2

      - name: Smoke-test main scene
        run: godot --headless --path . --quit-after 2
