name: Godot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Show Godot version
        run: godot --version

      - name: Import and parse project
        run: godot --headless --path . --editor --quit-after 2

      - name: Smoke-test main scene
        run: godot --headless --path . --quit-after 2

      - name: Validate gameplay progression
        run: godot --headless --path . --script res://tests/progression_smoke.gd

      - name: Export Web build
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: night-shift-web-${{ github.sha }}
          path: build/web
          if-no-files-found: error
          retention-days: 14
